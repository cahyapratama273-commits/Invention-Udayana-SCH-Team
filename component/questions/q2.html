<!-- ========================================================================== -->
<!-- BAGIAN: Komponen Kuis Pertanyaan 2 (Evaluasi Tingkat Energi Keseharian)     -->
<!-- FUNGSI: Mengukur kemampuan dan semangat pengguna dalam beraktivitas        -->
<!-- SUMBER: Modul Kuesioner BerTeduh (component/questions/q2.html)             -->
<!-- ========================================================================== -->
<div class="question-card py-2 px-2 sm:px-4" data-index="1" data-dimensi="energi">

  <!-- BAGIAN: Judul Utama Pertanyaan (Heading) -->
  <!-- FUNGSI: Menanyakan kondisi energi pengguna dalam menjalani rutinitas harian -->
  <!-- SUMBER: Naskah Pertanyaan Kuesioner BerTeduh -->
  <h2 class="font-sans text-[19px] sm:text-[22px] font-semibold text-white mt-1 mb-5 leading-relaxed tracking-wide">
    Ngomong-ngomong soal keseharian, buat ngerjain hal-hal biasa (kerja, kuliah, beres-beres), gimana rasanya belakangan ini?
  </h2>

  <!-- BAGIAN: Kontainer Opsi Pilihan Jawaban -->
  <!-- FUNGSI: Membungkus daftar tombol pilihan respons energi beserta ikon ekspresi wajah -->
  <div class="space-y-3">

    <!-- BAGIAN: Tombol Opsi 1 (Skor Hijau - Semangat & Lancar) -->
    <!-- FUNGSI: Memilih kondisi energi tinggi dan bersemangat -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f600.svg - Grinning Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="hijau">
      <!-- FUNGSI: Wadah teks deskripsi pilihan -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Masih semangat, bisa jalan seperti biasa
        </span>
      </div>
      <!-- FUNGSI: Wadah ikon ekspresi wajah dari CDN -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f600.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f600.svg" alt="Semangat" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 2 (Skor Kuning - Agak Berat / Usaha Ekstra) -->
    <!-- FUNGSI: Memilih kondisi energi sedang yang membutuhkan usaha lebih -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f610.svg - Neutral Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="kuning">
      <!-- FUNGSI: Wadah teks deskripsi pilihan -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Kerasa agak berat, butuh usaha lebih dari biasanya
        </span>
      </div>
      <!-- FUNGSI: Wadah ikon ekspresi wajah dari CDN -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f610.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f610.svg" alt="Agak Berat" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 3 (Skor Merah - Berat / Kelelahan) -->
    <!-- FUNGSI: Memilih kondisi energi rendah yang terasa sangat berat -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f62b.svg - Tired Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="merah">
      <!-- FUNGSI: Wadah teks deskripsi pilihan -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Lumayan berat, sering butuh dorongan ekstra buat mulai
        </span>
      </div>
      <!-- FUNGSI: Wadah ikon ekspresi wajah dari CDN -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f62b.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f62b.svg" alt="Berat" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

  </div>
</div>
