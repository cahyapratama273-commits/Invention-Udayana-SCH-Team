<!-- ========================================================================== -->
<!-- BAGIAN: Komponen Kuis Pertanyaan 1 (Evaluasi Mood / Suasana Hati)           -->
<!-- FUNGSI: Menampilkan pertanyaan awal mengenai kondisi emosional pengguna    -->
<!-- SUMBER: Modul Kuesioner BerTeduh (component/questions/q1.html)             -->
<!-- ========================================================================== -->
<div class="question-card py-2 px-2 sm:px-4" data-index="0" data-dimensi="mood">

  <!-- BAGIAN: Judul Utama Pertanyaan (Heading) -->
  <!-- FUNGSI: Memandu pengguna untuk menyampaikan perasaan emosionalnya -->
  <!-- SUMBER: Naskah Pertanyaan Kuesioner BerTeduh -->
  <h2 class="font-sans text-[19px] sm:text-[22px] font-semibold text-white mt-1 mb-5 leading-relaxed tracking-wide">
    Hai, apa kabar? Sebelum mulai, boleh cerita dulu gimana rasanya belakangan ini?
  </h2>

  <!-- BAGIAN: Kontainer Opsi Pilihan Jawaban -->
  <!-- FUNGSI: Membungkus pilihan jawaban beserta ikon ekspresi wajah CDN -->
  <div class="space-y-3">

    <!-- BAGIAN: Tombol Opsi 1 (Skor Hijau - Emosi Baik & Stabil) -->
    <!-- FUNGSI: Memilih indikator suasana hati dalam kondisi baik/aman -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f60a.svg - Smiling Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="hijau">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Baik kok, aman-aman aja
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon visual ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f60a.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f60a.svg" alt="Baik" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 2 (Skor Kuning - Emosi Netral / Naik Turun) -->
    <!-- FUNGSI: Memilih indikator suasana hati dalam kondisi naik-turun -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f610.svg - Neutral Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="kuning">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Yaa gitu deh, naik turun aja
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon visual ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f610.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f610.svg" alt="Netral" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 3 (Skor Merah - Emosi Berat / Butuh Perhatian) -->
    <!-- FUNGSI: Memilih indikator suasana hati dalam kondisi tidak gampang/sedih -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f614.svg - Pensive Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="merah">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Lagi nggak gampang sih, tapi susah dijelasin dengan kata-kata
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon visual ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f614.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f614.svg" alt="Berat" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

  </div>
</div>
