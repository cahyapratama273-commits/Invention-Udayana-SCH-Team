<!-- BAGIAN: Komponen Kuis Pertanyaan 6 (Evaluasi Kemampuan Konsentrasi & Fokus)-->
<!-- FUNGSI: Mengukur rentang konsentrasi dan stabilitas fokus harian           -->
<!-- SUMBER: Modul Kuesioner BerTeduh (component/questions/q6.html)             -->
<!-- ========================================================================== -->
<div class="question-card py-2 px-2 sm:px-4" data-index="6" data-dimensi="fokus">

  <!-- BAGIAN: Judul Utama Pertanyaan (Heading) -->
  <!-- FUNGSI: Menanyakan tingkat kemudahan pengguna dalam menjaga konsentrasi -->
  <!-- SUMBER: Naskah Pertanyaan Kuesioner BerTeduh -->
  <h2 class="font-sans text-[19px] sm:text-[22px] font-semibold text-white mt-1 mb-5 leading-relaxed tracking-wide">
    Masih nyambung sama isi kepala, gimana kemampuanmu buat fokus ke satu hal belakangan ini?
  </h2>

  <!-- BAGIAN: Kontainer Opsi Pilihan Jawaban -->
  <!-- FUNGSI: Membungkus daftar tombol opsi fokus beserta ikon ekspresi wajah -->
  <div class="space-y-3">

    <!-- BAGIAN: Tombol Opsi 1 (Skor Hijau - Fokus Mudah & Stabil) -->
    <!-- FUNGSI: Memilih kondisi konsentrasi baik dan lancar -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f642.svg - Slightly Smiling Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="hijau">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Masih gampang fokus ke satu hal
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f642.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f642.svg" alt="Fokus" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 2 (Skor Kuning - Fokus Suka Buyar / Mudah Terdistraksi) -->
    <!-- FUNGSI: Memilih kondisi konsentrasi terputus-putus -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f610.svg - Neutral Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="kuning">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Suka buyar di tengah jalan, harus diulang beberapa kali
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f610.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f610.svg" alt="Buyar" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 3 (Skor Merah - Susah Fokus / Disorientasi Perhatian) -->
    <!-- FUNGSI: Memilih kondisi sulit fokus dan merasa tidak terkoneksi dengan tugas -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f614.svg - Pensive Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="merah">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Lumayan susah fokus, sering ngerasa nggak nyantol ke apa yang dikerjain
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f614.svg -->

      </div>
    </button>

  </div>
