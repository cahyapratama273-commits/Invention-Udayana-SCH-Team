<!-- ========================================================================== -->
<!-- BAGIAN: Komponen Kuis Pertanyaan 3 (Evaluasi Kualitas Tidur & Istirahat)    -->
<!-- FUNGSI: Mengidentifikasi pola dan kualitas tidur pengguna                   -->
<!-- SUMBER: Modul Kuesioner BerTeduh (component/questions/q3.html)             -->
<!-- ========================================================================== -->
<div class="question-card py-2 px-2 sm:px-4" data-index="2" data-dimensi="tidur">

  <!-- BAGIAN: Judul Utama Pertanyaan (Heading) -->
  <!-- FUNGSI: Menanyakan kondisi tidur dan kesegaran tubuh beberapa hari terakhir -->
  <!-- SUMBER: Naskah Pertanyaan Kuesioner BerTeduh -->
  <h2 class="font-sans text-[19px] sm:text-[22px] font-semibold text-white mt-1 mb-5 leading-relaxed tracking-wide">
    Energi itu biasanya nyambung banget sama istirahat. Gimana tidurmu beberapa hari terakhir?
  </h2>

  <!-- BAGIAN: Kontainer Opsi Pilihan Jawaban -->
  <!-- FUNGSI: Membungkus pilihan jawaban pola tidur dengan ikon wajah CDN -->
  <div class="space-y-3">

    <!-- BAGIAN: Tombol Opsi 1 (Skor Hijau - Tidur Nyenyak & Segar) -->
    <!-- FUNGSI: Memilih kondisi tidur nyenyak dan segar -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f60c.svg - Relieved Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="hijau">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Cukup nyenyak, bangun lumayan seger
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f60c.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f60c.svg" alt="Nyenyak" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 2 (Skor Kuning - Kadang Insomnia / Pikiran Terdistraksi) -->
    <!-- FUNGSI: Memilih kondisi tidur yang terganggu oleh pikiran berjalan -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f914.svg - Thinking Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="kuning">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Kadang susah tidur, pikiran suka masih jalan terus
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f914.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f914.svg" alt="Kadang Susah" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 3 (Skor Merah - Susah Tidur / Kurang Istirahat) -->
    <!-- FUNGSI: Memilih kondisi gangguan tidur berat / lesu -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f625.svg - Disappointed / Sad Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="merah">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Lumayan sering susah tidur, jadi kerasa kurang istirahat
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f625.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f625.svg" alt="Susah Tidur" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

  </div>
</div>
