<!-- ========================================================================== -->
<!-- BAGIAN: Komponen Kuis Pertanyaan 4 (Evaluasi Sensasi Fisik & Somatis)       -->
<!-- FUNGSI: Mengidentifikasi gejala fisik akibat stres / kecemasan somatik     -->
<!-- SUMBER: Modul Kuesioner BerTeduh (component/questions/q4.html)             -->
<!-- ========================================================================== -->
<div class="question-card py-2 px-2 sm:px-4" data-index="3" data-dimensi="fisik">

  <!-- BAGIAN: Judul Utama Pertanyaan (Heading) -->
  <!-- FUNGSI: Menanyakan ada tidaknya keluhan fisik yang dirasakan tubuh -->
  <!-- SUMBER: Naskah Pertanyaan Kuesioner BerTeduh -->
  <h2 class="font-sans text-[19px] sm:text-[22px] font-semibold text-white mt-1 mb-5 leading-relaxed tracking-wide">
    Selain soal tidur, tubuhmu sendiri kerasa gimana belakangan ini?
  </h2>

  <!-- BAGIAN: Kontainer Opsi Pilihan Jawaban -->
  <!-- FUNGSI: Membungkus tombol pilihan kondisi fisik beserta ikon ekspresi wajah -->
  <div class="space-y-3">

    <!-- BAGIAN: Tombol Opsi 1 (Skor Hijau - Fisik Enteng / Tanpa Keluhan) -->
    <!-- FUNGSI: Memilih kondisi tubuh sehat dan tanpa keluhan berarti -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f642.svg - Slightly Smiling Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="hijau">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Enteng aja, nggak ada keluhan berarti
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f642.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f642.svg" alt="Enteng" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 2 (Skor Kuning - Ketegangan Otot / Somatik Ringan) -->
    <!-- FUNGSI: Memilih indikator gejala tegang di bahu, rahang, atau jantung deg-degan -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f61f.svg - Worried Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="kuning">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Kadang pegal, tegang di bahu/rahang, atau jantung suka deg-degan sendiri
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f61f.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f61f.svg" alt="Pegal" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <!-- BAGIAN: Tombol Opsi 3 (Skor Merah - Pusing / Sesak / Lemes Berlebih) -->
    <!-- FUNGSI: Memilih gejala psikosomatik berulang seperti pusing dan lemas -->
    <!-- SUMBER CDN ICON: Twitter Twemoji SVG via jsDelivr CDN (1f623.svg - Persevering Face) -->
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="merah">
      <!-- FUNGSI: Kartu teks pilihan jawaban -->
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-base sm:text-[17px] font-medium text-[#F5F5F5] leading-relaxed block">
          Lumayan sering pusing, sesak, atau badan lemes tanpa sebab yang jelas
        </span>
      </div>
      <!-- FUNGSI: Kontainer ikon ekspresi wajah -->
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <!-- SUMBER: https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f623.svg -->
        <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f623.svg" alt="Pusing" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

  </div>
</div>
