<div class="question-card py-2 px-8" data-index="3" data-dimensi="energi">
  <h2 class="text-2xl font-bold text-[#F5F5F5] mt-2 mb-6">
    Buat ngerjain hal-hal biasa (seperti kerja, kuliah, belajar, ataupun beres-beres rumah), rasanya gimana akhir-akhir ini?
  </h2>

  <div class="space-y-3">
    <button class="option-btn group flex place-content-between hover:scale-105 w-full text-left p-3 rounded-lg hover:border-[#2DD4A8] transition font-medium text-[#F5F5F5]" data-score="hijau">
      Masih semangat, bisa jalan seperti biasa
      <span class="opacity-0 group-hover:opacity-100" onmouseover="this.style.transform='scale(1.30)'" onmouseout="this.style.transform='scale(1)'">🔋</span>
    </button>
    <button class="option-btn group flex place-content-between hover:scale-105 w-full text-left p-3 rounded-lg hover:border-[#818CF8] transition font-medium text-[#F5F5F5]" data-score="kuning">
      Kerasa lebih berat dari biasanya, butuh effort ekstra
      <span class="opacity-0 group-hover:opacity-100" onmouseover="this.style.transform='scale(1.30)'" onmouseout="this.style.transform='scale(1)'">⚡</span>
    </button>
    <button class="option-btn group flex place-content-between hover:scale-105 w-full text-left p-3 rounded-lg hover:border-[#F472B6] transition font-medium text-[#F5F5F5]" data-score="merah">
      Berat banget, sering nunda atau nggak sanggup mulai
      <span class="opacity-0 group-hover:opacity-100" onmouseover="this.style.transform='scale(1.30)'" onmouseout="this.style.transform='scale(1)'">🪫</span>
    </button>
  </div>
</div>
