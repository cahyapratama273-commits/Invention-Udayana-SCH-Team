<div class="question-card py-2 px-8" data-index="10" data-dimensi="harapan">
  <h2 class="text-2xl font-bold text-[#F5F5F5] mt-2 mb-6">
    Terakhir soal masa depan, kalau mikirin besok atau minggu depan, perasaan apa yang paling kerasa?
  </h2>

  <div class="space-y-3">
    <button class="option-btn group flex place-content-between hover:scale-105 w-full text-left p-3 rounded-lg border border-white/10 hover:border-[#4ADE80] hover:bg-[#4ADE80]/10 transition font-medium text-[#F5F5F5]" data-score="hijau">
      Lumayan netral, atau malah ada yang dinanti
      <span class="opacity-0 group-hover:opacity-100 transition transform group-hover:scale-125">
        <img src="/assets/IconFromSVGRepo/q10/green.svg" alt="Netral" class="w-7 h-7 inline-block">
      </span>
    </button>
    <button class="option-btn group flex place-content-between hover:scale-105 w-full text-left p-3 rounded-lg border border-white/10 hover:border-[#FB923C] hover:bg-[#FB923C]/10 transition font-medium text-[#F5F5F5]" data-score="kuning">
      Agak cemas, atau males duluan mikirinnya
      <span class="opacity-0 group-hover:opacity-100 transition transform group-hover:scale-125">
        <img src="/assets/IconFromSVGRepo/q10/yellow.svg" alt="Cemas" class="w-7 h-7 inline-block">
      </span>
    </button>
    <button class="option-btn group flex place-content-between hover:scale-105 w-full text-left p-3 rounded-lg border border-white/10 hover:border-[#d10909] hover:bg-[#F87171]/10 transition font-medium text-[#F5F5F5]" data-score="merah">
      Lumayan berat, kayak belum ada tenaga buat mikirin itu dulu
      <span class="opacity-0 group-hover:opacity-100 transition transform group-hover:scale-125">
        <img src="/assets/IconFromSVGRepo/q10/red.svg" alt="Berat" class="w-7 h-7 inline-block">
      </span>
    </button>
  </div>
</div>
