<div class="question-card py-2 px-2 sm:px-4" data-index="10" data-dimensi="harapan">
  <h2 class="text-xl sm:text-2xl font-bold text-[#F5F5F5] mt-1 mb-5 leading-snug">
    Terakhir soal masa depan, kalau mikirin besok atau minggu depan, perasaan apa yang paling kerasa?
  </h2>

  <div class="space-y-3">
    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="hijau">
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-xs sm:text-sm font-medium text-[#F5F5F5] leading-relaxed block">
          Lumayan netral, atau malah ada yang dinanti
        </span>
      </div>
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <img src="/assets/icon_pertanyaan/q10/1.png" alt="Netral" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="kuning">
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-xs sm:text-sm font-medium text-[#F5F5F5] leading-relaxed block">
          Agak cemas, atau males duluan mikirinnya
        </span>
      </div>
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <img src="/assets/icon_pertanyaan/q10/2.png" alt="Cemas" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>

    <button type="button" class="option-btn flex items-center gap-3 w-full text-left bg-transparent p-0 border-0 cursor-pointer outline-none select-none" data-score="merah">
      <div class="option-card flex-1 min-w-0 p-3 sm:p-3.5 rounded-xl border border-white/10 bg-white/[0.04]">
        <span class="text-xs sm:text-sm font-medium text-[#F5F5F5] leading-relaxed block">
          Lumayan berat, kayak belum ada tenaga buat mikirin itu dulu
        </span>
      </div>
      <div class="emoji-box w-10 h-10 min-w-[40px] min-h-[40px] shrink-0 flex items-center justify-center">
        <img src="/assets/icon_pertanyaan/q10/3.png" alt="Berat" class="option-emoji w-6 h-6 object-contain pointer-events-none">
      </div>
    </button>
  </div>
</div>
