<script>
  (function () {
    const burger = document.getElementById("nav-burger");
    const burgerIcon = document.getElementById("nav-burger-icon");
    const mobileMenu = document.getElementById("nav-menu-mobile");
    if (burger && mobileMenu) {
      burger.addEventListener("click", () => {
        const isOpen = mobileMenu.classList.contains("nav-mobile-open");
        if (!isOpen) {
          burger.setAttribute("aria-expanded", "true");
          mobileMenu.classList.remove("hidden", "pointer-events-none", "-translate-y-3", "opacity-0");
          mobileMenu.classList.add("flex", "nav-mobile-open", "translate-y-0", "opacity-100");
          if (burgerIcon) {
            burgerIcon.style.transform = "rotate(180deg) scale(1.1)";
            setTimeout(() => {
              burgerIcon.className = "ph ph-x text-2xl transition-transform duration-300 transform";
              burgerIcon.style.transform = "rotate(0deg) scale(1)";
            }, 120);
          }
        } else {
          burger.setAttribute("aria-expanded", "false");
          mobileMenu.classList.remove("nav-mobile-open", "translate-y-0", "opacity-100");
          mobileMenu.classList.add("-translate-y-3", "opacity-0", "pointer-events-none");
          if (burgerIcon) {
            burgerIcon.style.transform = "rotate(-180deg) scale(1.1)";
            setTimeout(() => {
              burgerIcon.className = "ph ph-list text-2xl transition-transform duration-300 transform";
              burgerIcon.style.transform = "rotate(0deg) scale(1)";
            }, 120);
          }
          setTimeout(() => {
            if (!mobileMenu.classList.contains("nav-mobile-open")) {
              mobileMenu.classList.remove("flex");
              mobileMenu.classList.add("hidden");
            }
          }, 300);
        }
      });
    }
  })();
</script>
