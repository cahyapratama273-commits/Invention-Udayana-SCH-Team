<!DOCTYPE html>
<html lang="id">
<head>
  <script src="/js/session-gate.js"></script>
  <meta name="author" content="SCH Team - Invention Udayana 2026">
  <meta property="og:title" content="BerTeduh — Relaksasi">
  <meta property="og:description" content="Atasi stres dan cemas dengan Teduh, platform yang membantu kamu memahami emosi dan meningkatkan kesehatan mental.">
  <meta property="og:image" content="/assets/Images/Image-Bertapa.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teduh — Relaksasi</title>
  <link rel="icon" type="image/png" href="/assets/Images/for-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body data-page="relaksasi" style="background:#0D1220; color:#F5F5F5;">
  <div id="navbar-slot" class="relative z-50"></div>

  <main id="app-content" data-page="relaksasi">
    <section class="max-w-2xl mx-auto px-4 sm:px-6 pt-24 sm:pt-28 pb-12 sm:pb-16 text-center">
      <h1 class="text-2xl sm:text-3xl md:text-5xl font-medium mb-3 sm:mb-4" style="font-family:'Playfair Display',serif; color:#F5F5F5;">Latihan Pernapasan</h1>
      <p class="text-xs sm:text-sm text-[#8A93A8] mb-8 sm:mb-12">Ikuti panduan pernapasan di bawah ini untuk membantu meredakan kecemasan.</p>
      
      <div class="relative w-64 h-64 sm:w-72 sm:h-72 mx-auto mb-8 sm:mb-10 flex items-center justify-center">
        <!-- SVG Track -->
        <svg class="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"></circle>
          <circle id="breathe-progress" cx="100" cy="100" r="90" fill="none" stroke="#2DD4A8" stroke-width="6" stroke-linecap="round" stroke-dasharray="565.48" stroke-dashoffset="565.48" class="transition-colors duration-200"></circle>
        </svg>
        
        <!-- Glowing Dot -->
        <div id="breathe-dot" class="absolute w-4 h-4 rounded-full bg-[#2DD4A8] shadow-[0_0_15px_#2DD4A8] transition-colors duration-200" style="left: 50%; top: 5%; transform: translate(-50%, -50%);"></div>
        
        <!-- Central Text Info -->
        <div class="flex flex-col items-center justify-center relative z-10">
          <div id="breathe-phase-text" class="text-xl sm:text-2xl font-bold mb-1 transition-colors duration-200" style="color:#2DD4A8;">Siap</div>
          <div id="breathe-countdown" class="text-3xl sm:text-4xl font-light text-white mb-2">--</div>
          <div id="breathe-cycle-text" class="text-[10px] sm:text-xs text-[#8A93A8] uppercase tracking-wider">Siklus 0 dari 4</div>
        </div>
      </div>

      <div class="flex justify-center items-center gap-3 sm:gap-4 flex-wrap">
        <button id="btn-breathe-toggle" class="bg-[#2DD4A8] text-[#0D1220] px-6 sm:px-8 py-2.5 sm:py-3 rounded-full text-sm font-bold hover:scale-105 transition">Mulai Latihan</button>
        <button id="btn-breathe-stop" class="hidden px-6 sm:px-8 py-2.5 sm:py-3 rounded-full text-sm font-bold transition text-[#8A93A8] border border-[#8A93A8] hover:text-[#2DD4A8] hover:border-[#2DD4A8]">Berhenti</button>
      </div>
    </section>

    <script src="/js/NavRender.js"></script>
    <script src="/js/relaksasi/main.js"></script>
    <script src="/js/relaksasi/breathing.js"></script>
  </main>

  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/Nav.js"></script>
  <script src="/js/Footer.js"></script>
</body>
</html>
