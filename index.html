<!DOCTYPE html>
<html lang="id">
<head>
  <script src="/js/bg-randomizer.js"></script>
  <meta name="author" content="SCH Team - Invention Udayana 2026">
  <meta property="og:title" content="BerTeduh">
  <meta property="og:description" content="Atasi stres dan cemas dengan Teduh, platform yang membantu kamu memahami emosi dan meningkatkan kesehatan mental.">
  <meta property="og:image" content="/assets/Images/Image-Bertapa.webp">
  <meta property="og:url" content="https://youtube.com">
  <meta name="description" content="Atasi stres dan cemas dengan Teduh, platform yang membantu kamu memahami emosi dan meningkatkan kesehatan mental.">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teduh — Kenali Perasaanmu</title>
  <link rel="icon" type="image/png" href="/assets/Images/for-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body style="background:#0D1220; color:#F5F5F5;" class="flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-lg p-6 sm:p-8 rounded-3xl backdrop-blur-md shadow-2xl relative" style="background:#151B2E; border:1px solid rgba(255,255,255,0.12);">
        <div class="mb-6">
            <div class="flex justify-between items-center mb-1">
                <p class="text-[11px] sm:text-xs font-semibold uppercase tracking-widest mb-2 inline-block" style="color:#2DD4A8;">Sebelum kita mulai</p>
                <button id="quiz-close-btn" type="button" class="text-lg font-semibold text-[#8A93A8] hover:text-[#2DD4A8] transition-colors bg-transparent border-0 cursor-pointer p-1 -mr-1" title="Keluar kuis" aria-label="Keluar kuis">✕</button>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold mb-2" style="color:#F5F5F5; font-family:'Playfair Display',serif;">Yuk kenalan dulu sama perasaanmu</h1>
            <p class="text-xs sm:text-sm mb-5 leading-relaxed" style="color:#8A93A8;">Jawab sejujurnya ya, nggak akan ada jawaban salah kok</p>
            <div class="flex items-center gap-3">
                <div class="flex-1 h-1.5 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.08);">
                    <div id="quiz-progress-fill" class="h-full rounded-full transition-all duration-500" style="width:0%; background:#2DD4A8;"></div>
                </div>
                <span id="quiz-progress-label" class="text-xs font-semibold whitespace-nowrap" style="color:#8A93A8;">1 / 11</span>
            </div>
        </div>

        <div id="quiz-slot"></div>

        <!-- Controls: Kembali & Lewati Pertanyaan -->
        <div class="mt-6 flex items-center justify-between pt-4 border-t border-white/10">
            <button id="quiz-back-btn" type="button" class="text-xs sm:text-sm font-medium text-[#8A93A8] hover:text-[#F5F5F5] transition-colors flex items-center gap-1.5 bg-transparent border-0 cursor-pointer invisible">
                <i class="ph-bold ph-arrow-left text-sm"></i>
                <span>Kembali</span>
            </button>
            <button id="quiz-skip-btn" type="button" class="text-xs sm:text-sm font-medium text-[#8A93A8] hover:text-[#2DD4A8] transition-colors flex items-center gap-1.5 bg-transparent border-0 cursor-pointer ml-auto">
                <span>Lewati pertanyaan ini</span>
                <i class="ph-bold ph-arrow-right text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Modal Konfirmasi Keluar Kuis -->
    <div id="exit-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm hidden transition-all duration-300 opacity-0 pointer-events-none">
        <div class="w-full max-w-sm p-6 rounded-2xl shadow-2xl text-center transform transition-all duration-300 scale-95" style="background:#151B2E; border:1px solid rgba(255,255,255,0.15);">
            <div class="w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center text-xl" style="background:rgba(248,113,113,0.15); color:#F87171;">
                <i class="ph-bold ph-warning text-2xl"></i>
            </div>
            <h3 class="text-lg font-bold mb-2 text-[#F5F5F5]" style="font-family:'Playfair Display',serif;">Yakin mau keluar?</h3>
            <p class="text-xs sm:text-sm mb-6 leading-relaxed text-[#8A93A8]">
                Progress kuis kamu belum tersimpan dan akan hilang jika kamu keluar sekarang.
            </p>
            <div class="flex items-center gap-3">
                <button id="cancel-exit-btn" type="button" class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 border border-white/10 hover:border-white/20 text-[#F5F5F5] bg-white/5 hover:bg-white/10 cursor-pointer">
                    Batal
                </button>
                <button id="confirm-exit-btn" type="button" class="flex-1 py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-200 text-white bg-[#F87171] hover:bg-[#EF4444] shadow-lg shadow-red-500/20 cursor-pointer">
                    Ya, Keluar
                </button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/question.js"></script>
</body>
</html>
