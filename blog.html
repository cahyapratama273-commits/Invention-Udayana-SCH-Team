<!DOCTYPE html>
<html lang="id">
<head>
  <script src="/js/session-gate.js"></script>
  <meta name="author" content="SCH Team - Invention Udayana 2026">
  <meta property="og:title" content="BerTeduh — Blog">
  <meta property="og:description" content="Kumpulan artikel kesehatan mental.">
  <meta property="og:image" content="/assets/Images/Image-Bertapa.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teduh | Blog</title>
  <link rel="icon" type="image/png" href="/assets/Images/for-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body data-page="blog" style="background:#0D1220; color:#F5F5F5;">
  
  <!-- Fixed Background Image (Like Konsultasi) -->
  <div class="fixed inset-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
    <img src="/assets/Images/artikel/hutan1.webp" class="w-full h-full object-cover" alt="Background" onerror="this.onerror=null; this.src='/assets/Images/placeholder.svg';">
    <div class="absolute inset-0 bg-gradient-to-b from-[#0D1220]/85 via-[#0D1220]/70 to-[#0D1220]"></div>
  </div>

  <div id="navbar-slot" class="relative z-50"></div>

  <main id="app-content" data-page="blog">
    
    <!-- Header Blog -->
    <section class="w-full relative pt-28 sm:pt-36 pb-10 sm:pb-12 border-b border-white/10 mb-8 sm:mb-12">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 text-center">
        <span class="text-[11px] sm:text-xs font-semibold tracking-widest uppercase mb-2 inline-block" style="color:#2DD4A8;">Kumpulan Artikel</span>
        <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold mb-3 sm:mb-4" style="font-family:'Playfair Display',serif; color:#F5F5F5;">
          Ruang Baca
        </h1>
        <p class="text-sm sm:text-base leading-relaxed max-w-xl mx-auto" style="color:#8A93A8;">
          Kumpulan wawasan, cerita, dan panduan praktis untuk membantu merawat pikiranmu hari ini.
        </p>
      </div>
    </section>

    <!-- Featured Section -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 pb-12">
      <div id="featured-artikel-slot" class="w-full">
        <!-- Featured artikel placeholder -->
        <div class="rounded-2xl h-80 animate-pulse backdrop-blur-md" style="background:rgba(21,27,46,0.6); border:1px solid rgba(255,255,255,0.08);"></div>
      </div>
    </section>

    <!-- Filter, Search, and Grid Section -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 pb-20 sm:pb-24">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-6">
        
        <!-- Judul Section -->
        <h2 class="text-2xl sm:text-3xl font-bold shrink-0" style="font-family:'Playfair Display',serif; color:#F5F5F5;">
          Semua Artikel
        </h2>

        <div class="flex items-center gap-3 w-full md:w-auto">
          <!-- Button Toggle Filter -->
          <button id="toggle-filter-btn" class="flex items-center justify-center gap-2 text-sm text-[#8A93A8] hover:text-[#F5F5F5] transition px-4 py-2.5 backdrop-blur-md rounded-full border border-[rgba(255,255,255,0.08)] whitespace-nowrap shrink-0" style="background:rgba(21,27,46,0.6);">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
            </svg>
            <span class="hidden sm:inline">Kategori</span>
          </button>

          <!-- Search Bar -->
          <div class="relative flex-1 md:w-64 lg:w-72">
            <input type="text" id="blog-search-input" placeholder="Cari artikel..." 
                   class="w-full backdrop-blur-md border border-[rgba(255,255,255,0.08)] rounded-full py-2.5 pl-5 pr-12 text-sm text-[#F5F5F5] placeholder-[#8A93A8] focus:outline-none focus:border-[#2DD4A8] transition" style="background:rgba(21,27,46,0.6);">
            <svg class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-[#8A93A8]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Kategori Panel (Tersembunyi by default) -->
      <div id="filter-panel" class="hidden mb-8 p-6 backdrop-blur-md rounded-2xl border border-[rgba(255,255,255,0.08)]" style="background:rgba(21,27,46,0.6);">
        <p class="text-sm text-[#8A93A8] mb-4">Pilih Kategori:</p>
        <div id="blog-category-filter" class="flex flex-wrap gap-3">
          <!-- Kategori dinamis akan di-inject lewat JS -->
        </div>
      </div>

      <!-- Grid Artikel -->
      <div id="blog-artikel-grid" class="flex flex-col gap-4">
        <div class="tile rounded-2xl h-72 animate-pulse backdrop-blur-md" style="background:rgba(21,27,46,0.6);"></div>
        <div class="tile rounded-2xl h-72 animate-pulse backdrop-blur-md" style="background:rgba(21,27,46,0.6);"></div>
        <div class="tile rounded-2xl h-72 animate-pulse backdrop-blur-md" style="background:rgba(21,27,46,0.6);"></div>
      </div>

      <!-- Pagination Container -->
      <div id="blog-pagination" class="flex items-center justify-center gap-2 mt-12 flex-wrap"></div>
    </section>

    <script src="/js/ArtikelCard.js"></script>
    <script src="/js/NavRender.js"></script>
    <script src="/js/blog/main.js"></script>
  </main>

  <div id="footer"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/Nav.js"></script>
  <script src="/js/Footer.js"></script>
</body>
</html>
