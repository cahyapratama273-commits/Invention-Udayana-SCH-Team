<!DOCTYPE html>
<html lang="id">

<head>
  <script src="/js/session-gate.js"></script>
  <script src="/js/bg-randomizer.js"></script>
  <meta name="author" content="SCH Team - Invention Udayana 2026">
  <meta property="og:title" content="BerTeduh — Riak">
  <meta property="og:description" content="Ruang sensorik interaktif untuk meredakan ketegangan dan mengembalikan fokus batin.">
  <meta property="og:image" content="/assets/Images/Image-Bertapa.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BerTeduh — Riak</title>
  <link rel="icon" type="image/png" href="/assets/Images/for-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/tailwind.min.css" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/game/riak.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
</head>

<body data-page="riak" style="background:#0D1220; color:#F5F5F5;" class="overflow-x-hidden min-h-screen flex flex-col">

  <!-- Navbar Slot -->
  <header id="navbar-slot" class="relative z-50"></header>

  <main id="app-content" data-page="riak" class="relative flex flex-col flex-grow">

    <!-- Experience Container -->
    <div id="riak-experience-wrapper" class="riak-theme-air flex-grow w-full">

      <!-- Interactive 2D Canvas Layer -->
      <canvas id="riak-canvas" class="riak-canvas-layer" role="img" aria-label="Kanvas interaktif sensorik riak air, angkasa, dan menulis"></canvas>

      <!-- Top Overlay: Minimal Sensory Controls -->
      <div class="riak-controls-bar w-full max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 pt-24 sm:pt-28 pb-4 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none">
        
        <!-- Header Text Block -->
        <div class="pointer-events-auto text-center sm:text-left select-none">
          <span class="text-[11px] sm:text-xs font-semibold tracking-widest uppercase mb-1 inline-block" style="color:#2DD4A8;">Sentuhan Menenangkan</span>
          <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight" style="font-family:'Playfair Display',serif;">
            Riak
          </h1>
          <p id="riak-header-subheading" class="text-xs sm:text-sm leading-relaxed text-[#8A93A8] hidden sm:block riak-header-subheading mt-1">
            Sentuh perlahan dan biarkan ketenangan mengalir meredakan kepenatanmu.
          </p>
        </div>

        <!-- Controls Pill Bar for Desktop / Tablet (Theme, Tool Switcher, Color Picker, Mute) -->
        <div id="riak-desktop-controls" role="toolbar" aria-label="Kontrol Sensorik Riak" class="hidden md:flex pointer-events-auto items-center gap-3 p-2 sm:p-2.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-xl transition-all duration-300">
          
          <!-- Theme Switcher: Air ⇄ Angkasa ⇄ Menulis -->
          <div role="group" aria-label="Pilihan Mode Sensorik" class="flex items-center p-1 rounded-full bg-black/30 border border-white/10 gap-0.5 shrink-0">
            <button id="riak-theme-air-btn" type="button" class="riak-theme-btn active" title="Tema Air (Riak Gelombang)" aria-label="Tema Air">
              <i class="ph ph-drop text-base" aria-hidden="true"></i>
              <span>Air</span>
            </button>
            <button id="riak-theme-space-btn" type="button" class="riak-theme-btn" title="Tema Angkasa (Partikel Bintang)" aria-label="Tema Angkasa">
              <i class="ph ph-sparkle text-base" aria-hidden="true"></i>
              <span>Angkasa</span>
            </button>
            <button id="riak-theme-write-btn" type="button" class="riak-theme-btn" title="Tema Menulis (Pasir Halus & Tinta)" aria-label="Tema Menulis">
              <i class="ph ph-pencil-simple text-base" aria-hidden="true"></i>
              <span>Menulis</span>
            </button>
          </div>

          <!-- Divider -->
          <div class="w-px h-5 bg-white/20"></div>

          <!-- Mode Menulis Tools (Hidden by default, visible only in Menulis mode) -->
          <div id="riak-write-tools" role="group" aria-label="Alat Menulis Pasir" class="hidden items-center p-1 rounded-full bg-black/30 border border-white/10 gap-0.5 shrink-0 transition-all duration-200">
            <button id="riak-tool-draw-btn" type="button" class="riak-theme-btn active" title="Mode Tulis / Coret Pasir" aria-label="Mode Coret Pasir">
              <i class="ph ph-pencil-simple text-base" aria-hidden="true"></i>
              <span>Tulis</span>
            </button>
            <button id="riak-tool-erase-btn" type="button" class="riak-theme-btn" title="Mode Hapus (Penghapus)" aria-label="Mode Hapus">
              <i class="ph ph-eraser text-base" aria-hidden="true"></i>
              <span>Hapus</span>
            </button>
            <button id="riak-tool-clear-btn" type="button" class="riak-theme-btn hover:text-rose-400" title="Bersihkan Seluruh Pasir" aria-label="Bersihkan Seluruh Pasir">
              <i class="ph ph-trash text-base" aria-hidden="true"></i>
              <span>Sapu</span>
            </button>
          </div>

          <!-- Divider for Menulis tools -->
          <div id="riak-write-tools-divider" class="hidden w-px h-5 bg-white/20"></div>

          <!-- Ink Color Palette Picker (Always visible or customizable) -->
          <div id="riak-color-palette" role="group" aria-label="Pilihan Warna Tinta" class="flex items-center gap-1.5 shrink-0 px-1">
            <button type="button" data-color="#2DD4A8" class="riak-color-dot active bg-[#2DD4A8]" title="Emerald Mint" aria-label="Warna Hijau Mint"></button>
            <button type="button" data-color="#38BDF8" class="riak-color-dot bg-[#38BDF8]" title="Sky Blue" aria-label="Warna Biru Langit"></button>
            <button type="button" data-color="#F472B6" class="riak-color-dot bg-[#F472B6]" title="Rose Pink" aria-label="Warna Merah Muda"></button>
            <button type="button" data-color="#FBBF24" class="riak-color-dot bg-[#FBBF24]" title="Warm Amber" aria-label="Warna Kuning Hangat"></button>
            <button type="button" data-color="#A78BFA" class="riak-color-dot bg-[#A78BFA]" title="Soft Purple" aria-label="Warna Ungu Lembut"></button>
          </div>

          <!-- Divider -->
          <div class="w-px h-5 bg-white/20"></div>

          <!-- Zoom Controls (Extend Canvas Field) -->
          <div id="riak-zoom-controls" role="group" aria-label="Kontrol Perbesaran Kanvas" class="flex items-center p-1 rounded-full bg-black/30 border border-white/10 gap-0.5 shrink-0">
            <button id="riak-zoom-out-btn" type="button" class="riak-icon-btn text-xs px-2 py-1 hover:text-[#2DD4A8]" title="Perkecil Ruang (Zoom Out)" aria-label="Perkecil Ruang">
              <i class="ph ph-minus text-xs" aria-hidden="true"></i>
            </button>
            <span id="riak-zoom-level-text" class="text-[10px] font-mono font-semibold px-1 text-[#CBD5E1] select-none min-w-[32px] text-center">100%</span>
            <button id="riak-zoom-in-btn" type="button" class="riak-icon-btn text-xs px-2 py-1 hover:text-[#2DD4A8]" title="Perbesar Ruang (Zoom In)" aria-label="Perbesar Ruang">
              <i class="ph ph-plus text-xs" aria-hidden="true"></i>
            </button>
            <button id="riak-zoom-reset-btn" type="button" class="riak-icon-btn text-xs px-1.5 py-1 hover:text-[#2DD4A8] border-l border-white/10 ml-0.5" title="Reset Zoom ke 100%" aria-label="Reset Zoom">
              <i class="ph ph-arrows-in text-xs" aria-hidden="true"></i>
            </button>
          </div>

          <!-- Divider -->
          <div class="w-px h-5 bg-white/20"></div>

          <!-- Ambient Audio Mute / Unmute Button -->
          <button id="riak-audio-toggle-btn" type="button" class="riak-icon-btn" title="Audio Suasana Tenang (Mute/Unmute)" aria-label="Nyalakan atau Matikan Audio Sensorik">
            <i id="riak-audio-icon-on" class="ph ph-speaker-high text-lg" aria-hidden="true"></i>
            <i id="riak-audio-icon-off" class="ph ph-speaker-slash text-lg hidden" aria-hidden="true"></i>
          </button>

        </div>

      </div>

      <!-- Mobile Draggable FAB Menu Button & Popover (Mobile-only: md:hidden) -->
      <div id="riak-mobile-fab-container" class="md:hidden fixed bottom-6 right-6 z-40">
        <!-- Floating Trigger Button -->
        <button id="riak-mobile-fab-btn" type="button" class="w-14 h-14 rounded-full bg-[#151B2E] border border-white/20 shadow-2xl flex items-center justify-center text-white active:scale-95 transition-transform cursor-pointer" aria-label="Buka Menu Kontrol Riak" aria-expanded="false" aria-controls="riak-mobile-menu">
          <i class="ph ph-sliders-horizontal text-xl text-[#2DD4A8]"></i>
        </button>

        <!-- Mobile Floating Popover Menu -->
        <div id="riak-mobile-menu" class="hidden absolute bottom-16 right-0 w-72 p-4 rounded-2xl bg-[#151B2E]/95 backdrop-blur-xl border border-white/20 shadow-2xl flex flex-col gap-3 text-white transition-all duration-300 transform scale-95 opacity-0 pointer-events-none">
          
          <div class="flex items-center justify-between pb-2 border-b border-white/10">
            <span class="text-xs font-semibold uppercase tracking-wider text-[#2DD4A8]">Pengaturan Sensorik</span>
            <button id="riak-mobile-menu-close-btn" type="button" class="text-[#8A93A8] hover:text-white p-1" aria-label="Tutup Menu Sensorik">
              <i class="ph ph-x text-sm"></i>
            </button>
          </div>

          <!-- Mobile Theme Switcher -->
          <div class="flex flex-col gap-1.5">
            <span class="text-[11px] text-[#8A93A8]">Pilih Tema:</span>
            <div class="grid grid-cols-3 gap-1 bg-black/40 p-1 rounded-xl border border-white/10">
              <button id="riak-m-theme-air" type="button" class="riak-theme-btn active text-xs py-1.5 justify-center">
                <i class="ph ph-drop text-base"></i>
                <span>Air</span>
              </button>
              <button id="riak-m-theme-space" type="button" class="riak-theme-btn text-xs py-1.5 justify-center">
                <i class="ph ph-sparkle text-base"></i>
                <span>Angkasa</span>
              </button>
              <button id="riak-m-theme-write" type="button" class="riak-theme-btn text-xs py-1.5 justify-center">
                <i class="ph ph-pencil-simple text-base"></i>
                <span>Menulis</span>
              </button>
            </div>
          </div>

          <!-- Mobile Menulis Tools (Visible only in Menulis mode) -->
          <div id="riak-m-write-tools" class="hidden flex-col gap-1.5 pt-1 border-t border-white/10">
            <span class="text-[11px] text-[#8A93A8]">Alat Pasir:</span>
            <div class="grid grid-cols-3 gap-1 bg-black/40 p-1 rounded-xl border border-white/10">
              <button id="riak-m-tool-draw" type="button" class="riak-theme-btn active text-xs py-1.5 justify-center">
                <i class="ph ph-pencil-simple text-base"></i>
                <span>Tulis</span>
              </button>
              <button id="riak-m-tool-erase" type="button" class="riak-theme-btn text-xs py-1.5 justify-center">
                <i class="ph ph-eraser text-base"></i>
                <span>Hapus</span>
              </button>
              <button id="riak-m-tool-clear" type="button" class="riak-theme-btn text-xs py-1.5 justify-center hover:text-rose-400">
                <i class="ph ph-trash text-base"></i>
                <span>Sapu</span>
              </button>
            </div>
          </div>

          <!-- Mobile Zoom Controls -->
          <div class="flex items-center justify-between pt-1 border-t border-white/10">
            <span class="text-[11px] text-[#8A93A8]">Zoom Lapangan:</span>
            <div class="flex items-center gap-1 bg-black/40 p-1 rounded-xl border border-white/10">
              <button id="riak-m-zoom-out-btn" type="button" class="p-1 px-2 text-[#CBD5E1] hover:text-[#2DD4A8]" aria-label="Perkecil Zoom">
                <i class="ph ph-minus text-xs"></i>
              </button>
              <span id="riak-m-zoom-level-text" class="text-[10px] font-mono font-semibold px-1 text-center min-w-[28px]">100%</span>
              <button id="riak-m-zoom-in-btn" type="button" class="p-1 px-2 text-[#CBD5E1] hover:text-[#2DD4A8]" aria-label="Perbesar Zoom">
                <i class="ph ph-plus text-xs"></i>
              </button>
              <button id="riak-m-zoom-reset-btn" type="button" class="p-1 px-1.5 text-[#CBD5E1] hover:text-[#2DD4A8] border-l border-white/10" aria-label="Reset Zoom">
                <i class="ph ph-arrows-in text-xs"></i>
              </button>
            </div>
          </div>

          <!-- Mobile Color Palette Picker -->
          <div class="flex items-center justify-between pt-1 border-t border-white/10">
            <span class="text-[11px] text-[#8A93A8]">Warna:</span>
            <div id="riak-m-color-palette" class="flex items-center gap-2">
              <button type="button" data-color="#2DD4A8" class="riak-color-dot active bg-[#2DD4A8]" aria-label="Warna Hijau"></button>
              <button type="button" data-color="#38BDF8" class="riak-color-dot bg-[#38BDF8]" aria-label="Warna Biru"></button>
              <button type="button" data-color="#F472B6" class="riak-color-dot bg-[#F472B6]" aria-label="Warna Pink"></button>
              <button type="button" data-color="#FBBF24" class="riak-color-dot bg-[#FBBF24]" aria-label="Warna Kuning"></button>
              <button type="button" data-color="#A78BFA" class="riak-color-dot bg-[#A78BFA]" aria-label="Warna Ungu"></button>
            </div>
          </div>

          <!-- Mobile Audio Toggle -->
          <div class="flex items-center justify-between pt-1 border-t border-white/10">
            <span class="text-[11px] text-[#8A93A8]">Audio Suasana:</span>
            <button id="riak-m-audio-toggle" type="button" class="p-2 rounded-xl bg-white/10 flex items-center gap-1.5 text-xs font-medium cursor-pointer">
              <i id="riak-m-audio-icon-on" class="ph ph-speaker-high text-base text-[#2DD4A8]"></i>
              <i id="riak-m-audio-icon-off" class="ph ph-speaker-slash text-base text-[#8A93A8] hidden"></i>
              <span id="riak-m-audio-label">Suara Nyala</span>
            </button>
          </div>

        </div>
      </div>

      <!-- Centered Gentle Hint Overlay -->
      <div id="riak-hint" class="px-5 py-2.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-[#CBD5E1] text-xs sm:text-sm font-medium shadow-2xl flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#2DD4A8] animate-ping"></span>
        <span>Ketuk atau seret perlahan</span>
      </div>

    </div>

  </main>

  <!-- Footer Component Slot -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script defer src="/js/NavRender.js"></script>
  <script defer src="/js/Nav.js"></script>
  <script defer src="/js/Footer.js"></script>

  <!-- Sensory Engines, Audio, and UI Scripts -->
  <script defer src="/js/game/RiakAudio.js"></script>
  <script defer src="/js/game/MenulisEngine.js"></script>
  <script defer src="/js/game/RiakEngine.js"></script>
  <script defer src="/js/game/RiakUI.js"></script>
  <script defer src="/js/main.js"></script>
</body>

</html>
