<!DOCTYPE html>
<html lang="id">

<head>
  <script src="/js/session-gate.js"></script>
  <script src="/js/bg-randomizer.js"></script>
  <meta name="author" content="SCH Team - Invention Udayana 2026">
  <meta property="og:title" content="BerTeduh — Riak">
  <meta property="og:description" content="Ruang sensorik interaktif untuk meredakan ketegangan dan mengembalikan fokus batin.">
  <meta property="og:image" content="/assets/Images/Image-Bertapa.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BerTeduh — Riak</title>
  <link rel="icon" type="image/png" href="/assets/Images/for-icon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" type="text/css"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/game/riak.css" />
</head>

<body data-page="riak" style="background:#0D1220; color:#F5F5F5;" class="overflow-x-hidden min-h-screen flex flex-col">

  <!-- Navbar Slot -->
  <header id="navbar-slot" class="relative z-50"></header>

  <main id="app-content" data-page="riak" class="relative flex flex-col flex-grow">

    <!-- Experience Container -->
    <div id="riak-experience-wrapper" class="riak-theme-air flex-grow w-full">

      <!-- Interactive 2D Canvas Layer -->
      <canvas id="riak-canvas" class="riak-canvas-layer" role="img" aria-label="Kanvas interaktif sensorik riak air, angkasa, dan menulis"></canvas>

      <!-- Top Overlay: Minimal Sensory Controls -->
      <div class="riak-controls-bar w-full max-w-7xl mx-auto px-4 sm:px-6 md:px-8 lg:px-12 pt-24 sm:pt-28 pb-4 flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-none">
        
        <!-- Header Text Block -->
        <div class="pointer-events-auto text-center sm:text-left select-none">
          <span class="text-[11px] sm:text-xs font-semibold tracking-widest uppercase mb-1 inline-block" style="color:#2DD4A8;">Sentuhan Menenangkan</span>
          <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight" style="font-family:'Playfair Display',serif;">
            Riak
          </h1>
          <p id="riak-header-subheading" class="text-xs sm:text-sm leading-relaxed text-[#8A93A8] hidden sm:block riak-header-subheading mt-1">
            Sentuh perlahan dan biarkan ketenangan mengalir meredakan kepenatanmu.
          </p>
        </div>

        <!-- Controls Pill Bar for Desktop / Tablet (Theme, Tool Switcher, Color Picker, Mute) -->
        <div id="riak-desktop-controls" role="toolbar" aria-label="Kontrol Sensorik Riak" class="hidden md:flex pointer-events-auto items-center gap-3 p-2 sm:p-2.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-xl transition-all duration-300">
          
          <!-- Theme Switcher: Air ⇄ Angkasa ⇄ Menulis -->
          <div role="group" aria-label="Pilihan Mode Sensorik" class="flex items-center p-1 rounded-full bg-black/30 border border-white/10 gap-0.5 shrink-0">
            <button id="riak-theme-air-btn" type="button" class="riak-theme-btn active" title="Tema Air (Riak Gelombang)" aria-label="Tema Air">
              <i class="ph ph-drop text-base" aria-hidden="true"></i>
              <span class="hidden lg:inline">Air</span>
            </button>
            <button id="riak-theme-angkasa-btn" type="button" class="riak-theme-btn" title="Tema Angkasa (Partikel Bintang)" aria-label="Tema Angkasa">
              <i class="ph ph-sparkle text-base" aria-hidden="true"></i>
              <span class="hidden lg:inline">Angkasa</span>
            </button>
            <button id="riak-theme-menulis-btn" type="button" class="riak-theme-btn" title="Tema Menulis (Kertas & Pensil)" aria-label="Tema Menulis">
              <i class="ph ph-pencil-simple text-base" aria-hidden="true"></i>
              <span class="hidden lg:inline">Menulis</span>
            </button>
          </div>

          <!-- Menulis Tool Switcher: Pensil ⇄ Penghapus ⇄ Bersihkan (Smooth expandable wrapper when Menulis theme is active) -->
          <div id="riak-menulis-tools-wrapper" class="flex items-center shrink-0">
            <div id="riak-menulis-tools" role="group" aria-label="Peralatan Menulis" class="flex items-center p-1 rounded-full bg-black/30 border border-white/10 gap-0.5 shrink-0">
              <button id="riak-tool-pencil-btn" type="button" class="riak-tool-btn active" title="Pensil (Menggambar)" aria-label="Pensil">
                <i class="ph ph-pencil-simple text-base" aria-hidden="true"></i>
                <span class="hidden lg:inline">Pensil</span>
              </button>
              <button id="riak-tool-eraser-btn" type="button" class="riak-tool-btn" title="Penghapus" aria-label="Penghapus">
                <i class="ph ph-eraser text-base" aria-hidden="true"></i>
                <span class="hidden lg:inline">Penghapus</span>
              </button>
              <button id="riak-tool-clear-btn" type="button" class="riak-tool-btn hover:text-rose-400" title="Bersihkan Semua Goresan" aria-label="Bersihkan semua goresan">
                <i class="ph ph-trash text-base" aria-hidden="true"></i>
                <span class="hidden lg:inline">Bersihkan</span>
              </button>
            </div>
            <div id="riak-menulis-tool-divider" class="w-[1px] h-5 bg-white/15 ml-3 shrink-0"></div>
          </div>

          <div class="w-[1px] h-5 bg-white/15 shrink-0"></div>

          <!-- Color Picker -->
          <label for="riak-color-input" class="riak-color-picker-label shrink-0" title="Pilih Warna Sentuhan" aria-label="Pilih Warna Sentuhan">
            <span id="riak-color-preview" class="riak-color-preview" style="background-color: #38BDF8;"></span>
            <span class="text-[11px] text-[#CBD5E1] hidden lg:inline font-medium">Warna</span>
            <input type="color" id="riak-color-input" value="#38BDF8" class="riak-color-native-input" aria-label="Pilih Warna Sentuhan" />
          </label>

          <div class="w-[1px] h-5 bg-white/15 shrink-0"></div>

          <!-- Zoom Controls: (-) 100% (+) [Reset] -->
          <div id="riak-zoom-controls" role="group" aria-label="Kontrol Perbesaran Kanvas" class="flex items-center gap-1 shrink-0 p-0.5 rounded-full bg-black/30 border border-white/10">
            <button id="riak-zoom-out-btn" type="button" class="w-6 h-6 rounded-full flex items-center justify-center text-[#8A93A8] hover:text-[#F5F5F5] hover:bg-white/10 transition cursor-pointer" title="Zoom Out (Ctrl + Scroll / 25%-100%)" aria-label="Zoom Out">
              <i class="ph ph-minus text-xs" aria-hidden="true"></i>
            </button>
            <span id="riak-zoom-label" class="text-[10px] font-mono text-[#CBD5E1] w-8 text-center font-medium select-none">100%</span>
            <button id="riak-zoom-in-btn" type="button" class="w-6 h-6 rounded-full flex items-center justify-center text-[#8A93A8] hover:text-[#F5F5F5] hover:bg-white/10 transition cursor-pointer opacity-40" title="Zoom In (Ctrl + Scroll / Maksimal 100%)" aria-label="Zoom In">
              <i class="ph ph-plus text-xs" aria-hidden="true"></i>
            </button>
            <button id="riak-zoom-reset-btn" type="button" class="hidden w-6 h-6 rounded-full flex items-center justify-center text-[#2DD4A8] hover:bg-[#2DD4A8]/20 transition cursor-pointer" title="Reset Zoom (100%)" aria-label="Reset Zoom">
              <i class="ph ph-arrows-in text-xs" aria-hidden="true"></i>
            </button>
          </div>

          <div class="w-[1px] h-5 bg-white/15 shrink-0"></div>

          <!-- Mute Toggle Button -->
          <button id="riak-mute-btn" type="button" class="w-8 h-8 rounded-full flex items-center justify-center text-[#8A93A8] hover:text-[#F5F5F5] hover:bg-white/10 transition cursor-pointer shrink-0" title="Bisukan / Bunyikan Suara" aria-label="Bisukan suara">
            <span id="riak-icon-sound-on">
              <i class="ph ph-speaker-high text-lg" aria-hidden="true"></i>
            </span>
            <span id="riak-icon-sound-off" class="hidden">
              <i class="ph ph-speaker-slash text-lg" aria-hidden="true"></i>
            </span>
          </button>
        </div>
      </div>

      <!-- Mobile Draggable FAB Menu Button & Popover (Mobile-only: md:hidden) -->
      <div id="riak-mobile-fab-container" class="md:hidden fixed z-40 pointer-events-auto select-none" style="right: 18px; bottom: 85px;">
        <button id="riak-mobile-fab-btn" type="button" class="w-12 h-12 rounded-full flex items-center justify-center text-white bg-[#151D30]/85 backdrop-blur-xl border border-white/25 shadow-2xl transition-transform active:scale-95 cursor-grab active:cursor-grabbing" aria-label="Pengaturan Ruang Sensorik" title="Buka Menu Pengaturan">
          <i class="ph ph-sliders-horizontal text-xl text-[#2DD4A8]"></i>
        </button>

        <!-- Mobile Popover Menu -->
        <div id="riak-mobile-popover" class="hidden absolute flex-col gap-3.5 p-4 rounded-2xl bg-[#0F1626]/95 backdrop-blur-2xl border border-white/20 shadow-2xl w-64 max-w-[calc(100vw-32px)] z-50 text-white">
          <div class="flex items-center justify-between border-b border-white/10 pb-2.5">
            <span class="text-xs font-semibold tracking-wider text-[#CBD5E1] uppercase">Pengaturan Sensorik</span>
            <button id="riak-mobile-popover-close" type="button" class="w-6 h-6 rounded-full flex items-center justify-center text-[#8A93A8] hover:text-white hover:bg-white/10 transition" aria-label="Tutup Menu">
              <i class="ph ph-x text-sm"></i>
            </button>
          </div>

          <!-- Mode Switcher -->
          <div>
            <span class="text-[11px] text-[#8A93A8] mb-1.5 block font-medium">Pilih Mode</span>
            <div class="flex items-center gap-1.5 w-full">
              <button id="riak-mobile-theme-air-btn" type="button" class="riak-mobile-theme-btn active">
                <i class="ph ph-drop text-base"></i>
                <span>Air</span>
              </button>
              <button id="riak-mobile-theme-angkasa-btn" type="button" class="riak-mobile-theme-btn">
                <i class="ph ph-sparkle text-base"></i>
                <span>Angkasa</span>
              </button>
              <button id="riak-mobile-theme-menulis-btn" type="button" class="riak-mobile-theme-btn">
                <i class="ph ph-pencil-simple text-base"></i>
                <span>Menulis</span>
              </button>
            </div>
          </div>

          <!-- Mobile Menulis Tool Switcher: Pensil ⇄ Penghapus ⇄ Bersihkan (Visible when Menulis theme is active) -->
          <div id="riak-mobile-menulis-tools" class="hidden flex-col gap-1.5 pt-2 border-t border-white/10">
            <span class="text-[11px] text-[#8A93A8] block font-medium">Alat Menulis</span>
            <div class="flex items-center gap-1.5 w-full">
              <button id="riak-mobile-tool-pencil-btn" type="button" class="riak-mobile-tool-btn active flex-1">
                <i class="ph ph-pencil-simple text-base"></i>
                <span>Pensil</span>
              </button>
              <button id="riak-mobile-tool-eraser-btn" type="button" class="riak-mobile-tool-btn flex-1">
                <i class="ph ph-eraser text-base"></i>
                <span>Penghapus</span>
              </button>
              <button id="riak-mobile-tool-clear-btn" type="button" class="riak-mobile-tool-btn flex-1 hover:text-rose-400">
                <i class="ph ph-trash text-base"></i>
                <span>Clear</span>
              </button>
            </div>
          </div>

          <!-- Mobile Zoom Controls -->
          <div class="flex flex-col gap-1.5 pt-2 border-t border-white/10">
            <div class="flex items-center justify-between">
              <span class="text-[11px] text-[#8A93A8] block font-medium">Ukuran Tampilan (Zoom)</span>
              <span id="riak-mobile-zoom-label" class="text-[11px] font-mono text-[#CBD5E1] font-medium">100%</span>
            </div>
            <div class="flex items-center gap-1.5 w-full">
              <button id="riak-mobile-zoom-out-btn" type="button" class="riak-mobile-theme-btn flex-1 py-1.5 flex-row justify-center gap-1">
                <i class="ph ph-minus text-xs"></i>
                <span>Out</span>
              </button>
              <button id="riak-mobile-zoom-in-btn" type="button" class="riak-mobile-theme-btn flex-1 py-1.5 flex-row justify-center gap-1 opacity-40">
                <i class="ph ph-plus text-xs"></i>
                <span>In</span>
              </button>
              <button id="riak-mobile-zoom-reset-btn" type="button" class="hidden riak-mobile-theme-btn flex-1 py-1.5 flex-row justify-center gap-1 text-[#2DD4A8] border-[#2DD4A8]/40">
                <i class="ph ph-arrows-in text-xs"></i>
                <span>Reset</span>
              </button>
            </div>
          </div>

          <!-- Color Picker & Mute Controls -->
          <div class="flex items-center justify-between pt-1 border-t border-white/10">
            <!-- Mobile Color Picker -->
            <label for="riak-mobile-color-input" class="flex items-center gap-2 cursor-pointer py-1 px-2 rounded-xl hover:bg-white/5 transition">
              <span id="riak-mobile-color-preview" class="w-5 h-5 rounded-full border border-white/80 shadow-md flex-shrink-0" style="background-color: #38BDF8;"></span>
              <span class="text-xs text-[#CBD5E1] font-medium">Warna</span>
              <input type="color" id="riak-mobile-color-input" value="#38BDF8" class="sr-only" aria-label="Pilih Warna Sentuhan" />
            </label>

            <!-- Mobile Mute Button -->
            <button id="riak-mobile-mute-btn" type="button" class="flex items-center gap-1.5 text-xs text-[#CBD5E1] py-1 px-2.5 rounded-xl hover:bg-white/10 transition cursor-pointer">
              <span id="riak-mobile-icon-sound-on">
                <i class="ph ph-speaker-high text-base text-[#2DD4A8]"></i>
              </span>
              <span id="riak-mobile-icon-sound-off" class="hidden">
                <i class="ph ph-speaker-slash text-base text-[#8A93A8]"></i>
              </span>
              <span id="riak-mobile-mute-label">Bunyi</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Centered Gentle Hint Overlay -->
      <div id="riak-hint" class="px-5 py-2.5 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-[#CBD5E1] text-xs sm:text-sm font-medium shadow-2xl flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#2DD4A8] animate-ping"></span>
        <span>Ketuk atau seret perlahan</span>
      </div>

    </div>

  </main>

  <!-- Footer Component Slot -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/NavRender.js"></script>
  <script src="/js/Nav.js"></script>
  <script src="/js/Footer.js"></script>

  <!-- Sensory Engines, Audio, and UI Scripts -->
  <script src="/js/game/RiakAudio.js"></script>
  <script src="/js/game/MenulisEngine.js"></script>
  <script src="/js/game/RiakEngine.js"></script>
  <script src="/js/game/RiakUI.js"></script>
  <script src="/js/main.js"></script>
</body>

</html>
