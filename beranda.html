<!DOCTYPE html>
<html lang="id">
<head>
  <script src="/js/session-gate.js"></script>
  <meta name="author" content="SCH Team - Invention Udayana 2026">
  <meta property="og:title" content="BerTeduh">
  <meta property="og:description" content="Atasi stres dan cemas dengan Teduh">
  <meta property="og:image" content="/assets/Images/Image-Bertapa.webp">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teduh - Beranda</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body data-page="beranda" style="background:#0D1220; color:#F5F5F5;">

  <canvas id="starfield-canvas" aria-hidden="true"></canvas>

  <div id="navbar-slot" class="relative z-50"></div>

  <main id="app-content" data-page="beranda">

    <!-- HERO SECTION -->
    <section class="flex flex-col items-center justify-center text-center px-6" style="min-height:80vh;">
      <p class="text-xs font-semibold uppercase tracking-widest mb-6" style="color:#2DD4A8;">Ruang aman untukmu</p>
      <h1 class="text-4xl md:text-6xl font-bold leading-tight mb-6 max-w-3xl" style="font-family:'Playfair Display',serif; color:#F5F5F5;">
        Dunia Terlalu Terik.<br>Mari Berteduh Sejenak.
      </h1>
      <p class="text-base max-w-lg leading-relaxed" style="color:#8A93A8;">
        Ruang aman untuk mengurai isi kepala, membaca kembali emosi, dan beristirahat sejenak dari segala tuntutan.
      </p>
    </section>

    <!-- Bagian sapaan + artikel -->
    <section class="max-w-7xl mx-auto px-6 pb-16">

      <!-- Kartu Sapaan -->
       <div class="fade-left opacity-0 -translate-x-10 transition-all duration-700 ease-out"> 
        <!-- card untuk animasi fade in -->
         <div id="sapaan-card" class="rounded-2xl p-8 md:p-10 mb-10 min-h-[100px]"
           style="background:#1A2138; border:1px solid rgba(255,255,255,0.08); border-left:4px solid #2DD4A8;">
           <p id="element-judul-beranda" class="text-xl md:text-2xl font-semibold mb-2"
           style="color:#F5F5F5; font-family:'Playfair Display',serif;"></p>
           <p id="element-pesan-beranda" class="text-sm max-w-2xl" style="color:#8A93A8;"></p>
          </div>

      </div>

      <!-- Bagian Rekomendasi artikel -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <p id="rekomendasi-label" class="text-xs font-bold uppercase tracking-widest mb-1" style="color:#2DD4A8;"></p>
          <h2 id="rekomendasi-title" class="font-semibold text-xl" style="color:#F5F5F5; font-family:'Playfair Display',serif;"></h2>
        </div>
        <a href="/blog" class="text-sm font-semibold" style="color:#2DD4A8;">Lihat semua &rarr;</a>
      </div>

      <!-- Grid Artikel -->
      <div id="artikel-grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        <div class="tile rounded-2xl h-72 animate-pulse" style="background:#151B2E;"></div>
        <div class="tile rounded-2xl h-72 animate-pulse" style="background:#151B2E;"></div>
        <div class="tile rounded-2xl h-72 animate-pulse" style="background:#151B2E;"></div>
      </div>
    </section>

    <script src="/js/ArtikelCard.js"></script>
    <script src="/js/NavRender.js"></script>
    <script src="/js/beranda/Beranda.js"></script>
  </main>

  <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/js/Nav.js"></script>
  <script src="/js/Footer.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
